
models:
  - name: dim_addresses
    description: Tabela de dimensão de endereços, contendo País/Região, Estado/Província e Cidade. Linhas de endereço, código postal e localização espacial não são extraídos.
    columns:
      - name: pk_addressid
        description: Chave primária de endereços
        data_tests:
          - unique
          - not_null
      - name: city
        description: Cidade
        data_tests:
          - not_null
      - name: stateprovincecode
        description: Abreviação do estado/província
      - name: countryregioncode
        description: Abreviação do país/região
      - name: stateprovince_name
        description: Descrição do estado/província
      - name: countryregion_name
        description: Descrição do país/região
        data_tests:
          - not_null