
models:
  - name: fact_sales
    description: 'Tabela fato de vendas. Grão: salesorderdetail - a nível de produto por ordem de venda'
    columns:
      - name: pk_salesorderdetailid
        description: Chave da Sales Order Detail - Única
        data_tests:
          - unique
          - not_null  
      - name: fk_salesorderid
        description: Chave da Sales Order Header - Não única
        data_tests:
          - not_null
      - name: fk_customerid
        description: Chave do cliente (Tabela dim_customers)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: pk_customerid
      - name: fk_creditcardid
        description: Chave do cartão de crédito (Tabela dim_credit_cards). Nulo em pedidos sem cartão
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_credit_cards')
                field: pk_creditcardid
      - name: fk_territoryid
        description: Chave do território de vendas
      - name: fk_billtoaddressid
        description: Chave do endereço de cobrança (Tabela dim_address)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_addresses')
                field: pk_addressid
      - name: fk_shiptoaddressid
        description: Chave do endereço de envio (Tabela dim_address)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_addresses')
                field: pk_addressid
      - name: fk_productid
        description: Chave de produto (Tabela dim_products)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: pk_productid
      - name: revisionnumber
        description: Número de revisão
      - name: orderdate
        description: Data da ordem (Tabela dim_dates)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: pk_date
      - name: duedate
        description: Data de vencimento
      - name: shipdate
        description: Data de envio
      - name: status
        description: status do pedido
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6]
      - name: onlineorderflag
        description: Indica se a compra foi feita online
      - name: purchaseordernumber
        description: Número da ordem de compra
      - name: subtotal
        description: Subtotal da Order Header
      - name: taxamt
        description: Total em impostos da Order Header
      - name: freight
        description: Total em frete da Order Header
      - name: totaldue
        description: Total devido da Order Header
      - name: comment
        description: Comentários da Order Header
      - name: orderqty
        description: 'Quantidade do produto na ordem. Grão: Sales Order Detail'
        data_tests:
          - not_null
      - name: unitprice
        description: Preço por unidade de produto
        data_tests:
          - not_null
      - name: unitpricediscount
        description: Desconto por unidade de produto, como fração do preço (0 a 1)
      - name: salesorderdetailsubtotal
        description: Vendas brutas a nível do detalhe da ordem (orderqty * unitprice), antes de descontos
      - name: salesorderdetaildiscount
        description: Valor do desconto a nível do detalhe da ordem (orderqty * unitprice * unitpricediscount)
        data_tests:
          - not_null
      - name: salesorderdetailnetsubtotal
        description: Vendas líquidas a nível do detalhe da ordem, ou seja, vendas brutas menos desconto
        data_tests:
          - not_null